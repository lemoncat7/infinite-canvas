services:
  web:
    build: .
    container_name: infinite-canvas-web
    ports:
      - "4173:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  api:
    build:
      context: ./api
      args:
        APT_BUILD_PROXY: ${APT_BUILD_PROXY:-}
    container_name: infinite-canvas-api
    restart: unless-stopped
    environment:
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-router}
      IMAGE_GENERATION_CONCURRENCY: ${IMAGE_GENERATION_CONCURRENCY:-8}
      VIDEO_GENERATION_CONCURRENCY: ${VIDEO_GENERATION_CONCURRENCY:-2}
      CREDIT_ADMIN_KEY: ${CREDIT_ADMIN_KEY:-}
      IMAGE_GENERATION_PROVIDER: ${IMAGE_GENERATION_PROVIDER:-openai-image}
      VIDEO_GENERATION_PROVIDER: ${VIDEO_GENERATION_PROVIDER:-model-video}
      OPENAI_IMAGE_BASE_URL: ${OPENAI_IMAGE_BASE_URL:-}
      OPENAI_IMAGE_API_KEY: ${OPENAI_IMAGE_API_KEY:-}
      OPENAI_IMAGE_TIMEOUT_MS: ${OPENAI_IMAGE_TIMEOUT_MS:-180000}
      OPENAI_IMAGE_DEFAULT_MODEL: ${OPENAI_IMAGE_DEFAULT_MODEL:-gpt-image-2}
      OPENAI_VIDEO_BASE_URL: ${OPENAI_VIDEO_BASE_URL:-${OPENAI_IMAGE_BASE_URL:-}}
      OPENAI_VIDEO_API_KEY: ${OPENAI_VIDEO_API_KEY:-${OPENAI_IMAGE_API_KEY:-}}
      OPENAI_VIDEO_POLL_INTERVAL_MS: ${OPENAI_VIDEO_POLL_INTERVAL_MS:-5000}
      OPENAI_VIDEO_TIMEOUT_MS: ${OPENAI_VIDEO_TIMEOUT_MS:-900000}
      GROK_VIDEO_ENABLED: ${GROK_VIDEO_ENABLED:-false}
      AGNES_VIDEO_BASE_URL: ${AGNES_VIDEO_BASE_URL:-https://apihub.agnes-ai.com}
      AGNES_VIDEO_API_KEY: ${AGNES_VIDEO_API_KEY:-}
      AGNES_VIDEO_API_KEY_2: ${AGNES_VIDEO_API_KEY_2:-}
      AGNES_VIDEO_API_KEYS: ${AGNES_VIDEO_API_KEYS:-}
      AGNES_VIDEO_KEY_COOLDOWN_MS: ${AGNES_VIDEO_KEY_COOLDOWN_MS:-60000}
      AGNES_VIDEO_DEFAULT_MODEL: ${AGNES_VIDEO_DEFAULT_MODEL:-agnes-video-v2.0}
      AGNES_VIDEO_POLL_INTERVAL_MS: ${AGNES_VIDEO_POLL_INTERVAL_MS:-8000}
      AGNES_VIDEO_TIMEOUT_MS: ${AGNES_VIDEO_TIMEOUT_MS:-900000}
      AGNES_VIDEO_CREATE_TIMEOUT_MS: ${AGNES_VIDEO_CREATE_TIMEOUT_MS:-45000}
      AGNES_VIDEO_EMBEDDED_CREATE_TIMEOUT_MS: ${AGNES_VIDEO_EMBEDDED_CREATE_TIMEOUT_MS:-180000}
      AGNES_VIDEO_QUERY_TIMEOUT_MS: ${AGNES_VIDEO_QUERY_TIMEOUT_MS:-30000}
      GENERATION_PUBLIC_BASE_URL: ${GENERATION_PUBLIC_BASE_URL:-}
      AGNES_VIDEO_HTTPS_PROXY: ${AGNES_VIDEO_HTTPS_PROXY:-}
      AGNES_VIDEO_ASSET_MODE: ${AGNES_VIDEO_ASSET_MODE:-auto}
      ASSET_CDN_UPLOAD_URL: ${ASSET_CDN_UPLOAD_URL:-}
      ASSET_CDN_API_KEY: ${ASSET_CDN_API_KEY:-}
      OPENAI_IMAGE_HTTPS_PROXY: ${OPENAI_IMAGE_HTTPS_PROXY:-}
      PROMPT_AGENT_BASE_URL: ${PROMPT_AGENT_BASE_URL:-${OPENAI_IMAGE_BASE_URL:-}}
      PROMPT_AGENT_API_KEY: ${PROMPT_AGENT_API_KEY:-${OPENAI_IMAGE_API_KEY:-}}
      PROMPT_AGENT_MODEL: ${PROMPT_AGENT_MODEL:-kimi-k2.5}
      PROMPT_AGENT_TIMEOUT_MS: ${PROMPT_AGENT_TIMEOUT_MS:-90000}
      PROMPT_AGENT_HTTPS_PROXY: ${PROMPT_AGENT_HTTPS_PROXY:-${OPENAI_IMAGE_HTTPS_PROXY:-}}
      CUSTOM_GENERATION_BASE_URL: ${CUSTOM_GENERATION_BASE_URL:-}
      CUSTOM_GENERATION_API_KEY: ${CUSTOM_GENERATION_API_KEY:-}
      CUSTOM_GENERATION_SUBMIT_PATH: ${CUSTOM_GENERATION_SUBMIT_PATH:-/generations}
      CUSTOM_GENERATION_STATUS_PATH: ${CUSTOM_GENERATION_STATUS_PATH:-/generations/{id}}
      CUSTOM_GENERATION_POLL_INTERVAL_MS: ${CUSTOM_GENERATION_POLL_INTERVAL_MS:-1200}
      CUSTOM_GENERATION_TIMEOUT_MS: ${CUSTOM_GENERATION_TIMEOUT_MS:-600000}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
    volumes:
      - canvas-data:/data

volumes:
  canvas-data:
