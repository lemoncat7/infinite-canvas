server {
  listen 80;
  server_name _;
  client_max_body_size 150m;
  root /usr/share/nginx/html;
  index index.html;
  # Download URLs are short-lived credentials; do not persist them in access logs.
  location ^~ /api/asset-downloads/ {
    access_log off;
    proxy_pass http://api:3000/asset-downloads/;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Host $http_host;
  }
  location ^~ /api/ {
    proxy_pass http://api:3000/;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    # Preserve the public port for same-origin checks behind Docker/reverse proxies.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
